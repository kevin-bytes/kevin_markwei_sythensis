<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse movies · CineScout</title>
  <meta name="description" content="Search and filter movies by genre and sort order.">
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main" class="container">
    <div class="page-head">
      <h1>Browse movies</h1>
      <p class="muted">Search by title or narrow things down by genre.</p>
    </div>

    <form id="filters" class="filters" role="search">
      <input id="q" class="input" type="search" placeholder="Search by title…" aria-label="Search movies">
      <select id="sort" class="select" aria-label="Sort by">
        <option value="popularity">Most popular</option>
        <option value="rating">Highest rated</option>
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="title">Title A–Z</option>
      </select>
      <button class="btn" type="submit">Search</button>
    </form>

    <div id="chips" class="chips-row" role="group" aria-label="Filter by genre"></div>
    <p id="status" class="muted" aria-live="polite"></p>
    <div id="grid" class="grid"></div>
    <nav id="pager" class="pager" aria-label="Pagination"></nav>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="data/demo.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
